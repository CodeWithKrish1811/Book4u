# ===================================================================
# Book4u - Backend Application Configuration
# ===================================================================

# Application Metadata
spring.application.name=Book4u
server.port=${SERVER_PORT:8080}

# -------------------------------------------------------------------
# Database Connectivity (Spring JDBC + MySQL 8.x)
# No Hibernate / JPA is enabled in this application.
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/book4u_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# HikariCP Connection Pool Configuration
# -------------------------------------------------------------------
spring.datasource.hikari.pool-name=Book4uHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:5000}
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
# Do not abort Spring context startup if MySQL password is not yet configured locally;
# allows diagnostic endpoints and clear troubleshooting error reporting.
spring.datasource.hikari.initialization-fail-timeout=-1

# -------------------------------------------------------------------
# CORS Configuration
# -------------------------------------------------------------------
# Comma-separated list of allowed origins for local frontend development
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.book4u=DEBUG
# Enable Spring JDBC statement logging to clearly observe PreparedStatement execution
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
