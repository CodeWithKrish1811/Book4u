<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List a Textbook — Book4u</title>
    <meta name="description" content="Share an academic textbook with fellow students for swap, giveaway, or lending on Book4u.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Design System Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: var(--cw-cream);">

    <!-- Header -->
    <header class="cw-header">
        <div class="cw-header-container">
            <a href="index.html" class="cw-logo">
                <div class="cw-logo-icon"><span>B</span></div>
                <div class="cw-logo-text">
                    <span class="cw-logo-title">BOOK4U</span>
                    <span class="cw-logo-sub">STUDENT BOOKSTORE</span>
                </div>
            </a>

            <div class="cw-search-wrapper">
                <form action="explore.html" method="GET" class="cw-search-form">
                    <input type="text" name="query" class="cw-search-input" placeholder="Search by Title, Author, ISBN...">
                    <button type="submit" class="cw-search-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
                </form>
            </div>

            <div class="cw-header-actions nav-actions">
                <a href="wishlist.html" class="cw-action-item" title="Wishlist">
                    <div class="cw-icon-badge-wrap">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        <span class="cw-badge wishlist-count-badge" style="display: none;">0</span>
                    </div>
                </a>
                <a href="cart.html" class="cw-action-item" title="Shopping Bag">
                    <div class="cw-icon-badge-wrap">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                        <span class="cw-badge cart-count-badge" style="display: none;">0</span>
                    </div>
                </a>
                <a href="login.html" class="cw-btn cw-btn-outline guest-auth-btn">Sign In</a>
                <a href="register.html" class="cw-btn cw-btn-dark guest-auth-btn">Register</a>
            </div>
        </div>

        <nav class="cw-nav-bar">
            <div class="cw-nav-container">
                <ul class="cw-nav-list">
                    <li class="cw-nav-item"><a href="index.html" class="cw-nav-link">Home</a></li>
                    <li class="cw-nav-item"><a href="explore.html" class="cw-nav-link">All Books</a></li>
                    <li class="cw-nav-item"><a href="my-books.html" class="cw-nav-link">My Listings</a></li>
                    <li class="cw-nav-item"><a href="add-book.html" class="cw-nav-link active" style="color: var(--cw-burgundy); font-weight: 700;">+ List a Book</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="cw-container" style="padding-top: 2rem; padding-bottom: 5rem; max-width: 780px;">
            
            <nav class="cw-breadcrumbs" style="margin-bottom: 1.5rem; font-size: 0.85rem; color: #64748B;">
                <a href="index.html" style="color: var(--cw-burgundy);">Home</a> &gt; 
                <a href="my-books.html" style="color: var(--cw-burgundy);">My Books</a> &gt; 
                <span style="color: #1E293B; font-weight: 600;">List a Book</span>
            </nav>

            <div style="background: #FFFFFF; border: 1px solid var(--cw-border); border-radius: 12px; padding: 2.25rem; box-shadow: 0 4px 20px rgba(0,0,0,0.03);">
                <div style="text-align: center; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--cw-border);">
                    <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">📖</div>
                    <h1 style="font-family: var(--font-editorial); font-size: 2rem; margin: 0 0 0.5rem 0;">List an Academic Book</h1>
                    <p style="color: #64748B; font-size: 0.95rem;">Make your completed coursework textbooks available to fellow university students.</p>
                </div>

                <div id="add-book-alert" class="alert" style="display: none; margin-bottom: 1.5rem;"></div>

                <form id="add-book-form" novalidate>
                    <div class="form-grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
                        <div class="form-group">
                            <label for="book-title" style="font-size: 0.8rem; font-weight: 700; color: #475569; text-transform: uppercase;">Book Title *</label>
                            <input type="text" id="book-title" class="form-control" placeholder="e.g. Operating System Concepts" required autofocus>
                        </div>
                        <div class="form-group">
                            <label for="book-author" style="font-size: 0.8rem; font-weight: 700; color: #475569; text-transform: uppercase;">Author(s) *</label>
                            <input type="text" id="book-author" class="form-control" placeholder="e.g. Silberschatz, Galvin" required>
                        </div>
                    </div>

                    <div class="form-grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
                        <div class="form-group">
                            <label for="book-subject" style="font-size: 0.8rem; font-weight: 700; color: #475569; text-transform: uppercase;">Subject / Genre *</label>
                            <select id="book-subject" class="form-control" required>
                                <option value="" disabled selected>Select Subject</option>
                                <option value="Java">Java Programming</option>
                                <option value="DBMS">Database Systems (DBMS)</option>
                                <option value="DSA">Data Structures & Algorithms</option>
                                <option value="Networks">Computer Networks</option>
                                <option value="Operating Systems">Operating Systems</option>
                                <option value="Fiction">Fiction & Novels</option>
                                <option value="Comics">Comics & Manga</option>
                                <option value="Mathematics">Mathematics</option>
                                <option value="Other">Other Academic Subject</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="book-course" style="font-size: 0.8rem; font-weight: 700; color: #475569; text-transform: uppercase;">Course Code (Optional)</label>
                            <input type="text" id="book-course" class="form-control" placeholder="e.g. CS302">
                        </div>
                    </div>

                    <div class="form-grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
                        <div class="form-group">
                            <label for="book-isbn" style="font-size: 0.8rem; font-weight: 700; color: #475569; text-transform: uppercase;">ISBN</label>
                            <input type="text" id="book-isbn" class="form-control" placeholder="e.g. 9780134685991">
                        </div>
                        <div class="form-group">
                            <label for="book-edition" style="font-size: 0.8rem; font-weight: 700; color: #475569; text-transform: uppercase;">Edition</label>
                            <input type="text" id="book-edition" class="form-control" placeholder="e.g. 10th Edition">
                        </div>
                    </div>

                    <div class="form-grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
                        <div class="form-group">
                            <label for="book-condition" style="font-size: 0.8rem; font-weight: 700; color: #475569; text-transform: uppercase;">Condition Grade *</label>
                            <select id="book-condition" class="form-control" required>
                                <option value="LIKE_NEW">Like New (Unmarked, crisp)</option>
                                <option value="VERY_GOOD">Very Good (Light use)</option>
                                <option value="GOOD" selected>Good (Pencil marks/highlighter)</option>
                                <option value="ACCEPTABLE">Acceptable (Visible wear)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="book-mode" style="font-size: 0.8rem; font-weight: 700; color: #475569; text-transform: uppercase;">Sharing Mode *</label>
                            <select id="book-mode" class="form-control" required>
                                <option value="SWAP" selected>SWAP (Exchange for another book)</option>
                                <option value="GIVEAWAY">GIVEAWAY (Free gift to peer)</option>
                                <option value="LENDING">LENDING (Temporary loan)</option>
                            </select>
                        </div>
                    </div>

                    <div id="lending-duration-wrapper" class="form-group" style="display: none; margin-bottom: 1.25rem;">
                        <label for="book-lending-days" style="font-size: 0.8rem; font-weight: 700; color: #475569; text-transform: uppercase;">Maximum Loan Duration (Days) *</label>
                        <input type="number" id="book-lending-days" class="form-control" min="1" max="180" placeholder="e.g. 30">
                    </div>

                    <div class="form-group" style="margin-bottom: 1.25rem;">
                        <label for="book-swap" style="font-size: 0.8rem; font-weight: 700; color: #475569; text-transform: uppercase;">Swap Preferences (If Swapping)</label>
                        <input type="text" id="book-swap" class="form-control" placeholder="e.g. Looking for Computer Networks 5th Edition">
                    </div>

                    <div class="form-group" style="margin-bottom: 1.25rem;">
                        <label for="book-image" style="font-size: 0.8rem; font-weight: 700; color: #475569; text-transform: uppercase;">Cover Image URL (Optional)</label>
                        <input type="url" id="book-image" class="form-control" placeholder="https://example.com/cover.jpg">
                    </div>

                    <div class="form-group" style="margin-bottom: 1.75rem;">
                        <label for="book-desc" style="font-size: 0.8rem; font-weight: 700; color: #475569; text-transform: uppercase;">Description & Condition Notes</label>
                        <textarea id="book-desc" class="form-control" rows="3" placeholder="Condition details, highlight notes, course semester..."></textarea>
                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                        <a href="my-books.html" class="cw-btn cw-btn-outline">Cancel</a>
                        <button type="submit" id="btn-submit-book" class="cw-btn cw-btn-primary" style="padding: 0.75rem 2rem;">Publish Listing</button>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="cw-footer">
        <div class="cw-footer-container">
            <div class="cw-footer-bottom">
                <p>&copy; 2026 Book4u. Inspired by Crossword.in.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/books.js"></script>
</body>
</html>
